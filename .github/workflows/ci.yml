name: CI and Publish

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Check formatting using pre-commit
        uses: pre-commit/action@v3.0.1

  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      DEBUG: true
      SECRET_KEY: changeme
      DATABASE_URL: postgres://postgres@127.0.0.1/dienst2?atomic_requests=True
      CACHE_URL: dummycache://
      GOOGLE_IAP_AUDIENCE: /projects/966138216790/apps/wisvch
    services:
      postgres:
        image: postgres:15.17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dienst2
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dienst2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: python -m pip install poetry==2.2.1
      - name: Install dependencies
        run: poetry install --with dev
      - name: Check Django configuration
        run: poetry run python manage.py check
      - name: Check migrations
        run: poetry run python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: poetry run python manage.py test

  container:
    name: Container
    if: github.ref != 'refs/heads/master'
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wisvch/dienst2
          tags: |
            type=sha,format=short,prefix={{date 'YYYYMMDD'}}-${{ github.run_number }}-
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish
    if: github.ref == 'refs/heads/master'
    needs: [quality, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wisvch/dienst2
          tags: |
            type=sha,format=short,prefix={{date 'YYYYMMDD'}}-${{ github.run_number }}-
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
