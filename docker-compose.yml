version: "2.3"
services:
  django:
    build:
      context: .
      dockerfile: Dockerfile-dev
    env_file:
      - dev.env
    user: $UID
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      - postgres
    volumes:
      - .:/srv:cached
  postgres:
    image: postgres:15.20@sha256:10f9e886f772e9d6484350b043bcf990ead67ae5d9988ddce265d72a299055d5
    ports:
      - 127.0.0.1:5432:5432
    environment:
      - POSTGRES_USER=dienst2
      - POSTGRES_HOST_AUTH_METHOD=trust
