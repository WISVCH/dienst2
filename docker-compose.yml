version: "2.3"
services:
  django:
    build:
      context: .
      dockerfile: Dockerfile-dev
    env_file:
      - dev.env
    user: $UID
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      - postgres
    volumes:
      - .:/srv:cached
  postgres:
    image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    ports:
      - 127.0.0.1:5432:5432
    environment:
      - POSTGRES_USER=dienst2
      - POSTGRES_HOST_AUTH_METHOD=trust
