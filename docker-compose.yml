version: "2.3"
services:
  django:
    build:
      context: .
      dockerfile: Dockerfile-dev
    env_file:
      - dev.env
    user: $UID
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      - postgres
    volumes:
      - .:/srv:cached
  postgres:
    image: postgres:15.20@sha256:868b5ee219026c0f34c99d696d4494ccb3705cf1a18bed1e0b9de64d9c011ccd
    ports:
      - 127.0.0.1:5432:5432
    environment:
      - POSTGRES_USER=dienst2
      - POSTGRES_HOST_AUTH_METHOD=trust
